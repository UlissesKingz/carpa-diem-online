<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carpa Diem · Registro de salas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#071015; --panel:#101a23; --panel2:#0b141c; --line:rgba(249,224,193,.14);
      --text:#F9E0C1; --muted:#91a5ad; --teal:#66d6ca; --gold:#f1c95c;
      --danger:#ef6b68; --green:#72d39b; --blue:#73aee8;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 15% 0,rgba(47,166,155,.16),transparent 32%),linear-gradient(145deg,#05090d,#0a1219); }
    .topbar { position:sticky; top:0; z-index:10; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:18px; padding:14px 22px; border-bottom:1px solid var(--line); background:rgba(5,10,15,.92); backdrop-filter:blur(14px); }
    .topbar img { width:170px; height:52px; object-fit:contain; }
    h1,h2,h3,p { margin-top:0; }
    .topbar h1 { margin:0; font-size:1.18rem; }
    .topbar p { margin:3px 0 0; color:var(--muted); font-size:.78rem; }
    button { min-height:40px; border:1px solid var(--line); border-radius:11px; padding:0 14px; color:var(--text); background:rgba(255,255,255,.045); cursor:pointer; font-weight:800; }
    button:hover { border-color:rgba(102,214,202,.5); }
    main { width:min(1540px,calc(100% - 28px)); margin:22px auto 50px; display:grid; gap:18px; }
    .statusbar { display:flex; flex-wrap:wrap; gap:9px; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:rgba(255,255,255,.025); font-size:.76rem; }
    .pill.ok { color:var(--green); }
    .pill.warn { color:var(--gold); }
    .pill.danger { color:#ffaaa6; }
    .layout { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(320px,.72fr); gap:18px; align-items:start; }
    section { border:1px solid var(--line); border-radius:18px; padding:18px; background:linear-gradient(155deg,rgba(18,28,38,.96),rgba(8,14,20,.96)); box-shadow:0 18px 55px rgba(0,0,0,.25); }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .section-head h2 { margin:0; font-size:1rem; }
    .table-wrap { overflow:auto; border:1px solid rgba(249,224,193,.08); border-radius:13px; }
    table { width:100%; border-collapse:collapse; font-size:.8rem; }
    th,td { padding:11px 10px; border-bottom:1px solid rgba(249,224,193,.08); text-align:left; vertical-align:middle; white-space:nowrap; }
    th { position:sticky; top:0; z-index:1; color:var(--muted); background:#0d171f; font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:rgba(102,214,202,.045); }
    tbody tr:last-child td { border-bottom:0; }
    .room-code { color:var(--teal); font-size:1rem; font-weight:950; letter-spacing:.08em; }
    .names { display:flex; flex-wrap:wrap; gap:5px; max-width:330px; white-space:normal; }
    .name-chip { padding:4px 7px; border-radius:7px; color:#071015; background:#b9c7cc; font-size:.7rem; font-weight:900; }
    .name-chip.spectator { color:var(--text); background:#314653; }
    .name-chip.yellow{background:#f2cf4a}.name-chip.white{background:#f3f2eb}.name-chip.red{background:#c84a47;color:#fff}.name-chip.gray{background:#879298;color:#fff}
    .timeline { display:grid; gap:10px; max-height:690px; overflow:auto; padding-right:4px; }
    .event { position:relative; display:grid; grid-template-columns:14px 1fr; gap:10px; padding:10px 11px; border:1px solid rgba(249,224,193,.09); border-radius:12px; background:rgba(255,255,255,.025); }
    .event-dot { width:10px; height:10px; margin-top:4px; border-radius:50%; background:var(--blue); box-shadow:0 0 0 4px rgba(115,174,232,.1); }
    .event.outage .event-dot,.event.disconnect .event-dot { background:var(--danger); box-shadow:0 0 0 4px rgba(239,107,104,.1); }
    .event.return .event-dot,.event.start .event-dot { background:var(--green); box-shadow:0 0 0 4px rgba(114,211,155,.1); }
    .event.stop .event-dot,.event.closed .event-dot { background:var(--gold); box-shadow:0 0 0 4px rgba(241,201,92,.1); }
    .event strong { display:block; margin-bottom:3px; font-size:.79rem; }
    .event small { color:var(--muted); font-size:.68rem; }
    .empty { color:var(--muted); text-align:center; padding:32px 10px; }
    dialog { width:min(980px,calc(100% - 24px)); max-height:90vh; border:1px solid var(--line); border-radius:18px; padding:0; color:var(--text); background:#0c151d; box-shadow:0 30px 90px rgba(0,0,0,.65); }
    dialog::backdrop { background:rgba(0,0,0,.76); backdrop-filter:blur(8px); }
    .dialog-head { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line); background:#0c151d; }
    .dialog-body { padding:18px; overflow:auto; }
    .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
    .summary-card { padding:11px; border:1px solid rgba(249,224,193,.09); border-radius:12px; background:rgba(255,255,255,.025); }
    .summary-card span { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; }
    .summary-card strong { display:block; margin-top:5px; font-size:.86rem; white-space:normal; }
    .participants { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:9px; margin:10px 0 20px; }
    .participant { padding:11px; border:1px solid rgba(249,224,193,.09); border-radius:12px; background:rgba(255,255,255,.025); }
    .participant strong { display:block; margin-bottom:4px; }
    .participant small { color:var(--muted); }
    .room-events { display:grid; gap:8px; }
    .room-event { padding:11px 13px; border-left:3px solid var(--blue); border-radius:0 10px 10px 0; background:rgba(255,255,255,.025); }
    .room-event.disconnect { border-color:var(--danger); }
    .room-event.return { border-color:var(--green); }
    .room-event.closed { border-color:var(--gold); }
    .room-event .when { color:var(--muted); font-size:.68rem; margin-bottom:4px; }
    .error { color:#ffaaa6; }
    @media(max-width:1000px){ .layout{grid-template-columns:1fr}.timeline{max-height:none}.summary-grid{grid-template-columns:1fr 1fr} }
    @media(max-width:650px){ .topbar{grid-template-columns:1fr auto}.topbar img{grid-column:1/-1;margin:auto}.summary-grid{grid-template-columns:1fr} main{width:min(100% - 16px,1540px)} }
  </style>
</head>
<body>
  <header class="topbar">
    <img src="/assets/logo.png" alt="Carpa Diem">
    <div><h1>Registro de salas e conexões</h1><p>Abertura, participantes, quedas, retornos, encerramentos e disponibilidade do servidor.</p></div>
    <button id="refresh">Atualizar</button>
  </header>

  <main>
    <div id="status" class="statusbar"></div>
    <div class="layout">
      <section>
        <div class="section-head"><h2>Histórico de salas</h2><span id="roomCount" class="pill">0</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Abertura</th><th>Sala</th><th>Situação</th><th>Participantes</th><th>Quedas</th><th>Fechamento</th></tr></thead>
            <tbody id="rooms"></tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="section-head"><h2>Servidor</h2><span id="serverCount" class="pill">0 eventos</span></div>
        <div id="serverEvents" class="timeline"></div>
      </section>
    </div>
  </main>

  <dialog id="details">
    <div class="dialog-head"><strong id="detailTitle">Detalhes da sala</strong><button id="close">Fechar</button></div>
    <div id="detailBody" class="dialog-body"></div>
  </dialog>

  <script>
    const roomsEl=document.querySelector('#rooms');
    const serverEventsEl=document.querySelector('#serverEvents');
    const statusEl=document.querySelector('#status');
    const dialog=document.querySelector('#details');
    const detailTitle=document.querySelector('#detailTitle');
    const detailBody=document.querySelector('#detailBody');
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const date=(v)=>v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'medium'}):'—';
    const duration=(ms)=>{ if(ms==null)return'—'; const total=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60; return [h?`${h}h`:null,m?`${m}min`:null,`${s}s`].filter(Boolean).join(' '); };
    const role=(value)=>value==='spectator'?'Espectador':'Jogador';
    const statusLabel=(value)=>({open:'Aberta',empty:'Sem conectados',closed:'Encerrada'}[value]||value||'—');
    const statusClass=(value)=>value==='open'?'ok':value==='empty'?'warn':'';

    async function api(url){
      const response=await fetch(url,{credentials:'same-origin'});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error||`Erro ${response.status}`);
      return data;
    }

    function participantChips(participants=[]){
      if(!participants.length)return'<span class="meta">—</span>';
      return `<div class="names">${participants.map(p=>`<span class="name-chip ${esc(p.color||'')} ${p.role==='spectator'?'spectator':''}">${esc(p.name)} · ${role(p.role)}</span>`).join('')}</div>`;
    }

    function renderRooms(sessions){
      document.querySelector('#roomCount').textContent=`${sessions.length} registro(s)`;
      roomsEl.innerHTML=sessions.length?sessions.map(session=>`
        <tr data-session="${esc(session.sessionId)}">
          <td>${date(session.openedAt)}</td>
          <td><span class="room-code">${esc(session.roomCode)}</span></td>
          <td><span class="pill ${statusClass(session.status)}">${statusLabel(session.status)}</span></td>
          <td>${participantChips(session.participants)}</td>
          <td>${Number(session.disconnectCount||0)}</td>
          <td>${date(session.finalClosedAt||session.closedAt)}</td>
        </tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhuma sala registrada.</td></tr>';
      document.querySelectorAll('[data-session]').forEach(el=>el.onclick=()=>openSession(el.dataset.session));
    }

    function serverEventClass(type){
      if(type==='server_outage')return'outage';
      if(type==='server_restored')return'return';
      if(type==='server_started')return'start';
      if(type==='server_stopped')return'stop';
      return'';
    }

    function renderServerEvents(events){
      document.querySelector('#serverCount').textContent=`${events.length} eventos`;
      serverEventsEl.innerHTML=events.length?events.map(event=>`
        <article class="event ${serverEventClass(event.type)}">
          <span class="event-dot"></span>
          <div><strong>${esc(event.message||event.type)}</strong><small>${date(event.at)}${event.durationMs!=null?` · duração estimada ${duration(event.durationMs)}`:''}</small></div>
        </article>`).join(''):'<div class="empty">Nenhum evento do servidor registrado.</div>';
    }

    function roomEventClass(type){
      if(type==='participant_disconnected')return'disconnect';
      if(['participant_returned','room_reopened'].includes(type))return'return';
      if(['room_closed','room_final_closed','participant_left'].includes(type))return'closed';
      return'';
    }

    async function openSession(id){
      try{
        const data=await api(`/api/admin/room-sessions/${encodeURIComponent(id)}`);
        const s=data.session;
        detailTitle.textContent=`Sala ${s.roomCode}`;
        const participants=(s.participants||[]).map(p=>`
          <article class="participant">
            <strong>${esc(p.name)}</strong>
            <small>${role(p.role)}${p.color?` · ${esc(p.color)}`:''}<br>Entradas/retornos: ${Number(p.connectionCount||0)}<br>Quedas: ${Number(p.disconnectionCount||0)} · Saídas: ${Number(p.voluntaryExitCount||0)}</small>
          </article>`).join('')||'<div class="empty">Sem participantes registrados.</div>';
        const events=[...(s.events||[])].sort((a,b)=>new Date(a.at)-new Date(b.at)).map(event=>`
          <article class="room-event ${roomEventClass(event.type)}">
            <div class="when">${date(event.at)} · ${esc(event.type)}</div>
            <div>${esc(event.message||'Evento registrado.')}${event.reason?` <span class="pill">${esc(event.reason)}</span>`:''}</div>
          </article>`).join('')||'<div class="empty">Sem eventos.</div>';
        detailBody.innerHTML=`
          <div class="summary-grid">
            <div class="summary-card"><span>Aberta em</span><strong>${date(s.openedAt)}</strong></div>
            <div class="summary-card"><span>Situação</span><strong>${statusLabel(s.status)}</strong></div>
            <div class="summary-card"><span>Última atividade</span><strong>${date(s.lastActivityAt)}</strong></div>
            <div class="summary-card"><span>Fechamento</span><strong>${date(s.finalClosedAt||s.closedAt)}</strong></div>
          </div>
          <h3>Quem se conectou</h3><div class="participants">${participants}</div>
          <h3>Linha do tempo</h3><div class="room-events">${events}</div>`;
        dialog.showModal();
      }catch(error){ alert(error.message); }
    }

    async function load(){
      try{
        const data=await api('/api/admin/dashboard?limit=500');
        statusEl.innerHTML=`
          <span class="pill ${data.storage.enabled?'ok':'danger'}">MongoDB: ${data.storage.enabled?'conectado':'modo memória'}</span>
          <span class="pill">Banco: ${esc(data.storage.dbName||'—')}</span>
          <span class="pill">Salas ativas no servidor: ${(data.activeRooms||[]).length}</span>
          <span class="pill">Atualizado: ${new Date().toLocaleTimeString('pt-BR')}</span>`;
        renderRooms(data.roomSessions||[]);
        renderServerEvents(data.serverEvents||[]);
      }catch(error){ statusEl.innerHTML=`<span class="pill danger">${esc(error.message)}</span>`; }
    }

    document.querySelector('#refresh').onclick=load;
    document.querySelector('#close').onclick=()=>dialog.close();
    dialog.onclick=(event)=>{if(event.target===dialog)dialog.close();};
    load();
    setInterval(load,15000);
  </script>
</body>
</html>
