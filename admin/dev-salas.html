<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carpa Diem · Registros</title>
  <style>
    :root { color-scheme: dark; --bg:#071015; --panel:#101a23; --line:rgba(249,224,193,.14); --text:#F9E0C1; --muted:#91a5ad; --teal:#66d6ca; --gold:#f1c95c; --danger:#ef6b68; font-family:Inter,system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 15% 0,rgba(47,166,155,.16),transparent 32%),linear-gradient(145deg,#05090d,#0a1219); }
    header { position:sticky; top:0; z-index:10; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:18px; padding:14px 22px; border-bottom:1px solid var(--line); background:rgba(5,10,15,.9); backdrop-filter:blur(14px); }
    header img { width:170px; height:52px; object-fit:contain; }
    header h1 { margin:0; font-size:1.2rem; }
    header p { margin:3px 0 0; color:var(--muted); font-size:.78rem; }
    button { min-height:40px; border:1px solid var(--line); border-radius:11px; padding:0 13px; color:var(--text); background:rgba(255,255,255,.045); cursor:pointer; font-weight:800; }
    main { width:min(1500px,calc(100% - 28px)); margin:22px auto 50px; display:grid; gap:18px; }
    .status { display:flex; flex-wrap:wrap; gap:9px; }
    .pill { padding:7px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:rgba(255,255,255,.025); font-size:.76rem; }
    .pill.ok { color:var(--teal); }
    .grid { display:grid; grid-template-columns:1fr 1.25fr; gap:18px; align-items:start; }
    section { border:1px solid var(--line); border-radius:18px; padding:18px; background:linear-gradient(155deg,rgba(18,28,38,.96),rgba(8,14,20,.96)); box-shadow:0 18px 55px rgba(0,0,0,.25); }
    section > header { position:static; display:flex; justify-content:space-between; padding:0 0 14px; border:0; background:none; backdrop-filter:none; }
    section > header h2 { margin:0; font-size:1rem; }
    .cards { display:grid; gap:10px; }
    .card { display:grid; gap:8px; padding:12px; border:1px solid rgba(249,224,193,.1); border-radius:13px; background:rgba(255,255,255,.025); cursor:pointer; }
    .card:hover { border-color:rgba(102,214,202,.35); }
    .card-top { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .code { color:var(--teal); font-size:1.12rem; font-weight:950; letter-spacing:.08em; }
    .meta { color:var(--muted); font-size:.74rem; }
    .players { display:flex; flex-wrap:wrap; gap:6px; }
    .player { padding:5px 8px; border-radius:8px; color:#071015; font-size:.72rem; font-weight:900; }
    .yellow{background:#f2cf4a}.white{background:#f3f2eb}.red{background:#c84a47;color:#fff}.gray{background:#879298;color:#fff}
    table { width:100%; border-collapse:collapse; font-size:.8rem; }
    th,td { padding:10px 8px; border-bottom:1px solid rgba(249,224,193,.08); text-align:left; vertical-align:middle; }
    th { color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; }
    tr[data-id] { cursor:pointer; }
    tr[data-id]:hover { background:rgba(102,214,202,.045); }
    .empty { color:var(--muted); text-align:center; padding:30px 10px; }
    dialog { width:min(920px,calc(100% - 24px)); max-height:88vh; border:1px solid var(--line); border-radius:18px; padding:0; color:var(--text); background:#0c151d; box-shadow:0 30px 90px rgba(0,0,0,.65); }
    dialog::backdrop { background:rgba(0,0,0,.76); backdrop-filter:blur(8px); }
    .dialog-head { position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line); background:#0c151d; }
    .dialog-body { padding:18px; overflow:auto; }
    pre { overflow:auto; padding:14px; border-radius:12px; color:#c9d8db; background:#050a0f; font-size:.72rem; white-space:pre-wrap; word-break:break-word; }
    .error { color:#ffaaa6; }
    @media(max-width:900px){ .grid{grid-template-columns:1fr} header{grid-template-columns:1fr auto} header img{grid-column:1/-1;margin:auto} table{display:block;overflow:auto} }
  </style>
</head>
<body>
  <header>
    <img src="/assets/logo.png" alt="Carpa Diem">
    <div><h1>Registros de partidas</h1><p>Salas ativas, classificação, histórico e logs.</p></div>
    <button id="refresh">Atualizar</button>
  </header>
  <main>
    <div id="status" class="status"></div>
    <div class="grid">
      <section>
        <header><h2>Salas ativas</h2><span id="roomCount" class="pill">0</span></header>
        <div id="rooms" class="cards"></div>
      </section>
      <section>
        <header><h2>Partidas finalizadas</h2><span id="matchCount" class="pill">0</span></header>
        <div style="overflow:auto"><table><thead><tr><th>Data</th><th>Sala</th><th>Vencedor</th><th>Placar</th><th>Duração</th></tr></thead><tbody id="matches"></tbody></table></div>
      </section>
    </div>
  </main>
  <dialog id="details"><div class="dialog-head"><strong id="detailTitle">Detalhes</strong><button id="close">Fechar</button></div><div id="detailBody" class="dialog-body"></div></dialog>
  <script>
    const roomsEl=document.querySelector('#rooms'); const matchesEl=document.querySelector('#matches'); const statusEl=document.querySelector('#status');
    const dialog=document.querySelector('#details'); const detailTitle=document.querySelector('#detailTitle'); const detailBody=document.querySelector('#detailBody');
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const duration=(ms)=>{ if(ms==null)return'—'; const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000); return `${m}m ${s}s`; };
    const date=(v)=>v?new Date(v).toLocaleString('pt-BR'):'—';
    async function api(url){ const response=await fetch(url,{credentials:'same-origin'}); const data=await response.json().catch(()=>({})); if(!response.ok)throw new Error(data.error||`Erro ${response.status}`); return data; }
    function renderRooms(rooms){ document.querySelector('#roomCount').textContent=rooms.length; roomsEl.innerHTML=rooms.length?rooms.map(room=>`<article class="card" data-room="${esc(room.code)}"><div class="card-top"><span class="code">${esc(room.code)}</span><span class="pill ${room.players.every(p=>p.connected)?'ok':''}">${esc(room.status)} · ${esc(room.phase)}</span></div><div class="meta">Rodada ${room.round||0}/5 · ${room.spectators.length} espectador(es) · atualização ${date(room.updatedAt)}</div><div class="players">${room.players.map(p=>`<span class="player ${p.color}">${esc(p.name)} ${p.connected?'●':'○'} · ${p.coins} moedas</span>`).join('')}</div></article>`).join(''):'<div class="empty">Nenhuma sala ativa.</div>'; document.querySelectorAll('[data-room]').forEach(el=>el.onclick=()=>openRoom(el.dataset.room)); }
    function renderMatches(matches){ document.querySelector('#matchCount').textContent=matches.length; matchesEl.innerHTML=matches.length?matches.map(match=>{const winner=(match.players||[])[0];return `<tr data-match="${esc(match.matchId)}"><td>${date(match.finishedAt)}</td><td><strong>${esc(match.roomCode)}</strong></td><td>${winner?`<span class="player ${winner.color}">${esc(winner.name)}</span>`:'—'}</td><td>${winner?`${winner.score} carpas · ${winner.coins} moedas`:'—'}</td><td>${duration(match.durationMs)}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">Nenhuma partida registrada.</td></tr>'; document.querySelectorAll('[data-match]').forEach(el=>el.onclick=()=>openMatch(el.dataset.match)); }
    async function load(){ try{ const data=await api('/api/admin/dashboard?limit=200'); statusEl.innerHTML=`<span class="pill ${data.storage.enabled?'ok':''}">MongoDB: ${data.storage.enabled?'conectado':'modo memória'}</span><span class="pill">Banco: ${esc(data.storage.dbName||'—')}</span><span class="pill">Atualizado: ${new Date().toLocaleTimeString('pt-BR')}</span>`; renderRooms(data.activeRooms||[]); renderMatches(data.matches||[]); }catch(error){ statusEl.innerHTML=`<span class="pill error">${esc(error.message)}</span>`; } }
    async function openRoom(code){ const data=await api(`/api/admin/rooms/${encodeURIComponent(code)}`); detailTitle.textContent=`Sala ${code}`; detailBody.innerHTML=`<pre>${esc(JSON.stringify(data.room,null,2))}</pre>`; dialog.showModal(); }
    async function openMatch(id){ const data=await api(`/api/admin/matches/${encodeURIComponent(id)}`); detailTitle.textContent=`Partida ${id}`; detailBody.innerHTML=`<pre>${esc(JSON.stringify(data.match,null,2))}</pre>`; dialog.showModal(); }
    document.querySelector('#refresh').onclick=load; document.querySelector('#close').onclick=()=>dialog.close(); dialog.onclick=(e)=>{if(e.target===dialog)dialog.close()};
    load(); setInterval(load,15000);
  </script>
</body>
</html>
